<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Tracker — Mockup</title>
  <style>
    :root{--bg:#f3f8fb;--surface:#fff;--surface2:#edf5f8;--border:#d7e4ea;--text:#16313c;--muted:#68808a;--accent:#087f8c;--accent-soft:#dff3f5;--success:#23835b;--danger:#c94c5c;--radius:18px;--shadow:0 12px 34px #2c5c7014;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light}
    *{box-sizing:border-box} [hidden]{display:none!important} body{margin:0;background:linear-gradient(180deg,#eaf5f9 0,#f7fafb 260px,var(--bg) 100%);color:var(--text);min-height:100vh} button,input{font:inherit} button{cursor:pointer}
    .login-screen{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(100%,420px);padding:28px;border:1px solid var(--border);border-radius:26px;background:#fff;box-shadow:0 22px 60px #2c5c7024}.login-brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:25px}.login-card h1{font-size:25px}.login-card h2{margin:0;text-align:center;font-size:19px}.login-hint{text-align:center;color:var(--muted);margin:7px 0 18px}.profiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}.profile-choice{min-height:112px;border:1px solid var(--border);border-radius:18px;background:#fff;color:var(--text);font-weight:850;display:grid;place-items:center;align-content:center;gap:7px}.profile-choice:hover,.profile-choice:focus,.profile-choice.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px #087f8c14}.profile-icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#dceff5;color:#176c86;font-size:30px;font-weight:900}.profile-choice[data-user="irene"] .profile-icon{background:#f4e6ef;color:#a04c7c}.password-label{display:block;margin:19px 0 7px;font-size:14px;font-weight:800}.login-password{width:100%;min-height:50px;border:1px solid var(--border);border-radius:14px;background:#fff;color:var(--text);padding:0 14px;outline:none}.login-password:focus{border-color:var(--accent);box-shadow:0 0 0 3px #087f8c18}.login-button{width:100%;min-height:50px;margin-top:12px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:900}.login-error{min-height:20px;margin:9px 0 0;color:var(--danger);font-size:13px;text-align:center}.top-actions{display:flex;align-items:center;gap:7px}.user-chip{border:1px solid var(--border);min-height:42px;border-radius:14px;background:#fff;color:var(--text);padding:0 11px;font-weight:800}.logout{border:0;background:none;color:var(--muted);font-weight:800;padding:8px}
    .shell{width:min(100%,860px);margin:auto;padding:0 16px 94px}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px;background:linear-gradient(var(--bg) 75%,transparent)}
    .brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:950;font-size:21px;box-shadow:0 8px 20px #087f8c35} h1{font-size:21px;margin:0}.sync{font-size:12px;color:var(--muted);margin-top:2px}.icon-btn,.add{border:1px solid var(--border);min-width:46px;min-height:46px;border-radius:15px;background:var(--surface);color:var(--accent);font-size:24px}
    .summary{display:flex;justify-content:space-between;align-items:end;margin:12px 2px 18px}.summary h2{font-size:27px;margin:0 0 4px}.summary p{margin:0;color:var(--muted);font-size:14px}.refresh{border:0;background:none;color:var(--accent);font-weight:800;padding:10px}
    .sort-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-2px 2px 14px}.sort-row label{color:var(--muted);font-size:14px;font-weight:750}.sort-select{min-height:42px;max-width:230px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--text);padding:0 34px 0 12px;font-weight:750}
    .list{display:grid;gap:14px}.show{overflow:hidden;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}.show-main{display:grid;grid-template-columns:92px 1fr;min-height:142px}.poster{position:relative;background:var(--poster);display:grid;align-items:end;padding:10px;isolation:isolate}.poster:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#000b);z-index:-1}.poster span{color:#fff;font-weight:900;line-height:.95;font-size:16px;text-shadow:0 2px 12px #000}.body{padding:14px 14px 12px;min-width:0}.title-row{display:flex;justify-content:space-between;gap:8px}.title{font-size:18px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.menu{border:0;background:none;color:var(--muted);font-size:21px;padding:0 2px}.badge{display:inline-flex;margin-top:8px;border-radius:999px;padding:5px 9px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:850}.badge.clear{background:#e6f4ec;color:var(--success)}.provider{display:inline-flex;margin:8px 0 0 6px;border:1px solid var(--border);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:12px;font-weight:750}.episode{margin-top:12px}.episode strong{display:block;font-size:14px}.episode small{color:var(--muted);display:block;margin-top:3px}.actions{display:flex;gap:8px;margin-top:12px}.primary,.secondary,.danger{min-height:42px;border-radius:12px;padding:0 14px;font-weight:850}.primary{background:var(--accent);color:#fff;border:0}.secondary{border:1px solid var(--border);background:#fff;color:var(--text)}.show-foot{border-top:1px solid var(--border);padding:10px 14px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;background:#fbfdfe}.future{color:#8a6714}
    .fab{position:fixed;z-index:6;right:max(20px,calc((100vw - 860px)/2 + 20px));bottom:24px;width:58px;height:58px;border-radius:19px;border:0;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 12px 30px #087f8c55}
    dialog{width:min(calc(100% - 24px),580px);max-height:90vh;border:1px solid var(--border);border-radius:24px;background:var(--surface);color:var(--text);padding:0;box-shadow:0 30px 80px #173d4d42}dialog::backdrop{background:#17313a66;backdrop-filter:blur(4px)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 12px}.modal-head h2{margin:0;font-size:21px}.modal-body{padding:6px 18px 20px}.search{width:100%;min-height:50px;border:1px solid var(--border);border-radius:14px;background:#fff;color:var(--text);padding:0 14px;outline:none}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px #087f8c18}.hint{font-size:12px;color:var(--muted);margin:8px 2px 14px}.results{display:grid;gap:8px}.result{display:grid;grid-template-columns:45px 1fr auto;align-items:center;gap:11px;border:1px solid var(--border);background:var(--surface2);border-radius:14px;padding:8px;text-align:left;color:var(--text)}.thumb{width:45px;height:58px;border-radius:8px;background:var(--poster)}.result strong,.result small{display:block}.result small{color:var(--muted);margin-top:4px}.plus{color:var(--accent);font-size:24px;padding-right:7px}.empty{padding:24px;text-align:center;color:var(--muted)}.provider-step h3{margin:4px 0 5px}.provider-step>p{margin:0 0 16px;color:var(--muted);font-size:14px}.provider-options{display:grid;gap:9px}.provider-choice{min-height:50px;border:1px solid var(--border);border-radius:14px;background:#fff;color:var(--text);font-weight:800;text-align:left;padding:0 15px}.provider-choice:hover,.provider-choice:focus{border-color:var(--accent);background:var(--accent-soft)}.chosen-show{display:flex;align-items:center;gap:11px;padding:10px;margin-bottom:16px;border-radius:14px;background:var(--surface2)}.chosen-show .thumb{flex:none}.change-show{margin-top:14px;border:0;background:none;color:var(--accent);font-weight:800;padding:8px 0}
    .detail{display:none}.back{border:0;background:none;color:var(--accent);font-weight:800;padding:10px 0}.hero{display:grid;grid-template-columns:105px 1fr;gap:16px;margin:10px 0 22px}.hero .poster{height:155px;border-radius:16px}.hero h2{margin:3px 0 7px;font-size:25px}.hero p{color:var(--muted);margin:0;line-height:1.45}.season{border:1px solid var(--border);border-radius:15px;margin-bottom:10px;overflow:hidden;background:#fff}.season summary{padding:15px;background:var(--surface);font-weight:850;cursor:pointer}.episode-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-top:1px solid var(--border)}.episode-row small{display:block;color:var(--muted);margin-top:3px}.upcoming-episode{margin:12px 14px 14px;padding:13px 14px;border:1px solid #d9b75966;border-radius:13px;background:#fff9e9}.upcoming-label{display:block;color:#8a6714;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.upcoming-episode strong{display:block;margin-top:5px}.upcoming-episode small{display:block;margin-top:4px;color:var(--muted)}.mini{border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:850;padding:9px 11px}.danger{width:100%;margin-top:18px;border:1px solid #c94c5c55;background:#fff;color:var(--danger)}
    .toast{position:fixed;left:50%;bottom:24px;z-index:20;transform:translate(-50%,30px);background:#16313c;color:#fff;padding:12px 16px;border-radius:12px;font-weight:800;opacity:0;pointer-events:none;transition:.25s}.toast.on{opacity:1;transform:translate(-50%,0)}
    .confirm-body{padding:2px 20px 20px}.confirm-body h2{margin:4px 0 8px;font-size:21px}.confirm-body p{margin:0;color:var(--muted);line-height:1.5}.confirm-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.confirm-actions button{min-height:44px;border-radius:12px;padding:0 16px;font-weight:850}.cancel-confirm{border:1px solid var(--border);background:#fff;color:var(--text)}.accept-confirm{border:0;background:var(--accent);color:#fff}.accept-confirm.danger-confirm{background:var(--danger)}.undo{width:100%;min-height:44px;margin:2px 0 10px;border:1px solid #c9972f66;border-radius:12px;background:#fff9e9;color:#7c5b12;font-weight:850}
    @media(max-width:500px){.shell{padding-left:12px;padding-right:12px}.show-main{grid-template-columns:84px 1fr}.actions{flex-wrap:wrap}.primary,.secondary{flex:1}.show-foot{display:block}.show-foot span{display:block;margin-top:3px}}
  </style>
</head>
<body>
  <section class="login-screen" id="loginScreen"><div class="login-card"><div class="login-brand"><div class="logo">▶</div><h1>TV Tracker</h1></div><h2>Chi sta guardando?</h2><p class="login-hint">Scegli il tuo profilo e inserisci la password.</p><div class="profiles"><button class="profile-choice" data-user="fabio"><span class="profile-icon">♂</span><span>Fabio</span></button><button class="profile-choice" data-user="irene"><span class="profile-icon">♀</span><span>Irene</span></button></div><label class="password-label" for="loginPassword">Password</label><input class="login-password" id="loginPassword" type="password" autocomplete="current-password" placeholder="Inserisci la password"><button class="login-button" id="loginButton">Accedi</button><p class="login-error" id="loginError" role="alert"></p></div></section>
  <main class="shell" id="appShell" hidden>
    <section id="home">
      <header class="top"><div class="brand"><div class="logo">▶</div><div><h1>TV Tracker</h1><div class="sync">Lista condivisa · aggiornata ora</div></div></div><div class="top-actions"><button class="user-chip" id="activeUser"></button><button class="icon-btn" id="refreshTop" aria-label="Aggiorna">↻</button><button class="logout" id="logout">Esci</button></div></header>
      <div class="summary"><div><h2>Da vedere</h2><p id="summaryText">5 nuove puntate in 3 serie</p></div><button class="refresh" id="refresh">Aggiorna</button></div>
      <div class="sort-row"><label for="sortMode">Ordina per</label><select class="sort-select" id="sortMode"><option value="activity">Ultima attività</option><option value="alphabetical">Titolo A–Z</option><option value="unwatched">Più puntate da vedere</option><option value="added">Inserite di recente</option><option value="nextEpisode">Prossima uscita</option></select></div>
      <div class="list" id="showList"></div>
    </section>
    <section class="detail" id="detail"></section>
  </main>
  <button class="fab" id="openAdd" aria-label="Aggiungi serie" hidden>＋</button>
  <dialog id="addDialog"><div class="modal-head"><h2>Aggiungi una serie</h2><button class="icon-btn" id="closeAdd" aria-label="Chiudi">×</button></div><div class="modal-body"><input class="search" id="search" placeholder="Cerca per titolo…" autocomplete="off"><div class="hint">Mockup: prova a scrivere “the”, “severance” o “only”.</div><div class="results" id="results"></div></div></dialog>
  <dialog id="confirmDialog"><div class="confirm-body"><h2 id="confirmTitle"></h2><p id="confirmMessage"></p><div class="confirm-actions"><button class="cancel-confirm" id="cancelConfirm">Annulla</button><button class="accept-confirm" id="acceptConfirm"></button></div></div></dialog>
  <div class="toast" id="toast"></div>
  <script>
    const users=[{id:'fabio',name:'Fabio'},{id:'irene',name:'Irene'}];let selectedUserId=null,activeUser=null;
    const shows=[
      {id:1,title:'Severance',provider:'Apple TV+',addedAt:'2026-08-18T10:00:00Z',lastViewedAt:'2026-09-17T20:30:00Z',nextAirDate:'2026-09-20',poster:'url(https://www.sanity.com.au/media/Images/fullimage/1808702/SDC_1402075_2026-29-1--11-40-08.jpg) center/cover',badge:2,next:'S02 E07 · Chikhai Bardo',date:'Data catalogo: 28 febbraio',future:'Prossima: S02 E09 · 20 settembre',episodes:[['S02 E07','Chikhai Bardo','28 feb'],['S02 E08','Sweet Vitriol','7 mar']]},
      {id:2,title:'The Last of Us',provider:'NOW',addedAt:'2026-07-02T09:00:00Z',lastViewedAt:'2026-09-12T21:10:00Z',nextAirDate:'2026-09-27',poster:'url(https://img.championat.com/i/a/h/1739999332497798288.jpg) center/cover',badge:1,next:'S02 E05 · Feel Her Love',date:'Data catalogo: domenica',future:'Prossima: S02 E06 · 27 settembre',episodes:[['S02 E05','Feel Her Love','11 mag']]},
      {id:3,title:'Only Murders in the Building',provider:'Disney+',addedAt:'2026-06-11T18:00:00Z',lastViewedAt:'2026-09-15T19:45:00Z',nextAirDate:null,poster:'url(https://artworks.thetvdb.com/banners/v4/season/2136904/posters/66d89a13c03b6.jpg) center/cover',badge:2,next:'S04 E08 · Lifeboat',date:'Data catalogo: 15 ottobre',future:'Stagione completa',episodes:[['S04 E08','Lifeboat','15 ott'],['S04 E09','Escape from Planet Klongo','22 ott']]},
      {id:4,title:'Slow Horses',provider:'Apple TV+',addedAt:'2026-05-20T12:00:00Z',lastViewedAt:'2026-09-10T22:00:00Z',nextAirDate:'2026-10-04',poster:'url(https://lemicdk.github.io/filminglocs/images/Slow%20horses/Season%204/poster.png?updatedAt=1725482792111) center/cover',badge:0,next:'Sei in pari',date:'Ultima vista: S04 E06',future:'Nuova puntata: 4 ottobre',episodes:[]},
      {id:5,title:'Ted Lasso',provider:'Apple TV+',addedAt:'2026-09-18T08:00:00Z',lastViewedAt:null,nextAirDate:'2026-09-25',poster:'url(https://images.squarespace-cdn.com/content/v1/5bc7409ec46f6d369ce5f644/1599511958815-0IJDDBQ46FKWNAB11JUI/9%2Bted%2Blasso.jpg) center/cover',badge:38,next:'S01 E01 · Pilot',date:'Da iniziare',future:'Prossima: S04 E05 · 25 settembre',episodes:[['S01 E01','Pilot','14 ago']],seasons:[
        {number:1,count:10,poster:'url(https://images.squarespace-cdn.com/content/v1/5bc7409ec46f6d369ce5f644/1599511958815-0IJDDBQ46FKWNAB11JUI/9%2Bted%2Blasso.jpg) center/cover',episodes:[['S01 E01','Pilot'],['S01 E02','Biscuits'],['S01 E03','Trent Crimm: The Independent']]},
        {number:2,count:12,poster:'url(https://artworks.thetvdb.com/banners/v4/season/1921068/posters/640d8c7a4aeba.jpg) center/cover',episodes:[['S02 E01','Goodbye Earl'],['S02 E02','Lavender'],['S02 E03','Do the Right-est Thing']]},
        {number:3,count:12,poster:'url(https://artworks.thetvdb.com/banners/v4/season/2047526/posters/640d8a77ef0e8.jpg) center/cover',episodes:[['S03 E01','Smells Like Mean Spirit'],['S03 E02','(I Don’t Want to Go to) Chelsea'],['S03 E03','4-5-1']]},
        {number:4,count:4,poster:'url(https://cdn.moviefone.com/admin-uploads/highlights/images/ted-lasso-season-4-official-poster_1778165532.webp) center/cover',episodes:[['S04 E01','Nuovo episodio'],['S04 E02','Nuovo episodio'],['S04 E03','Nuovo episodio']],upcoming:{code:'S04 E05',title:'Believe Again',date:'25 settembre 2026'}}
      ]}
    ];
    const $=s=>document.querySelector(s); const list=$('#showList'); const progressHistory=new Map();
    document.querySelectorAll('.profile-choice').forEach(button=>button.onclick=()=>{selectedUserId=button.dataset.user;document.querySelectorAll('.profile-choice').forEach(item=>item.classList.toggle('selected',item===button));$('#loginError').textContent='';$('#loginPassword').focus()});
    function login(){const password=$('#loginPassword').value;if(!selectedUserId){$('#loginError').textContent='Scegli Fabio oppure Irene.';return}if(password!=='xxx'){$('#loginError').textContent='Password non corretta.';return}activeUser=users.find(user=>user.id===selectedUserId);$('#activeUser').textContent=activeUser.name;$('#loginScreen').hidden=true;$('#appShell').hidden=false;$('#openAdd').hidden=false;$('#loginError').textContent='';toast('Accesso effettuato come '+activeUser.name)}
    function logout(){activeUser=null;selectedUserId=null;$('#appShell').hidden=true;$('#openAdd').hidden=true;$('#loginScreen').hidden=false;$('#loginPassword').value='';document.querySelectorAll('.profile-choice').forEach(item=>item.classList.remove('selected'))}
    $('#loginButton').onclick=login;$('#loginPassword').onkeydown=e=>{if(e.key==='Enter')login()};$('#logout').onclick=logout;
    function sortedShows(){const mode=$('#sortMode').value,copy=[...shows],byTitle=(a,b)=>a.title.localeCompare(b.title,'it');if(mode==='alphabetical')return copy.sort(byTitle);if(mode==='unwatched')return copy.sort((a,b)=>b.badge-a.badge||byTitle(a,b));if(mode==='added')return copy.sort((a,b)=>b.addedAt.localeCompare(a.addedAt)||byTitle(a,b));if(mode==='nextEpisode')return copy.sort((a,b)=>{if(!a.nextAirDate&&!b.nextAirDate)return byTitle(a,b);if(!a.nextAirDate)return 1;if(!b.nextAirDate)return -1;return a.nextAirDate.localeCompare(b.nextAirDate)||byTitle(a,b)});return copy.sort((a,b)=>{if(!a.lastViewedAt&&!b.lastViewedAt)return byTitle(a,b);if(!a.lastViewedAt)return 1;if(!b.lastViewedAt)return -1;return b.lastViewedAt.localeCompare(a.lastViewedAt)||byTitle(a,b)})}
    function render(){list.innerHTML=sortedShows().map(s=>`<article class="show"><div class="show-main"><div class="poster" style="--poster:${s.poster}"><span>${s.title}</span></div><div class="body"><div class="title-row"><div class="title">${s.title}</div><button class="menu" aria-label="Opzioni">•••</button></div><span class="badge ${s.badge?'':'clear'}">${s.badge?s.badge+' '+(s.badge===1?'nuova':'nuove'):'In pari'}</span><span class="provider">${s.provider} · Italia</span><div class="episode"><strong>${s.next}</strong><small>${s.date}</small></div><div class="actions">${s.badge?`<button class="primary watched" data-id="${s.id}">✓ Vista</button>`:''}<button class="secondary details" data-id="${s.id}">Dettaglio</button></div></div></div><div class="show-foot"><span class="future">${s.future}</span><span>Sincronizzata ora</span></div></article>`).join(''); updateSummary()}
    function updateSummary(){const n=shows.reduce((a,s)=>a+s.badge,0), active=shows.filter(s=>s.badge).length;$('#summaryText').textContent=n?`${n} nuove puntate in ${active} serie`:'Siete in pari con tutto'}
    function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
    function confirmAction({title,message,label,danger=false}){return new Promise(resolve=>{const dialog=$('#confirmDialog'),accept=$('#acceptConfirm');$('#confirmTitle').textContent=title;$('#confirmMessage').textContent=message;accept.textContent=label;accept.classList.toggle('danger-confirm',danger);const finish=value=>{dialog.close();accept.onclick=null;$('#cancelConfirm').onclick=null;resolve(value)};accept.onclick=()=>finish(true);$('#cancelConfirm').onclick=()=>finish(false);dialog.oncancel=e=>{e.preventDefault();finish(false)};dialog.showModal()})}
    function rememberProgress(show){const history=progressHistory.get(show.id)??[];history.push(JSON.parse(JSON.stringify(show)));progressHistory.set(show.id,history)}
    function mark(id,targetSeasonIndex,targetEpisodeIndex){const s=shows.find(x=>x.id===id);if(!s||!s.badge)return;rememberProgress(s);if(s.seasons){const firstSeasonIndex=s.seasons.findIndex(x=>x.count>0);const seasonIndex=Number.isInteger(targetSeasonIndex)?targetSeasonIndex:firstSeasonIndex;const episodeIndex=Number.isInteger(targetEpisodeIndex)?targetEpisodeIndex:0;let watchedCount=0;s.seasons.forEach((season,index)=>{if(index<seasonIndex){watchedCount+=season.count;season.count=0;season.episodes=[];return}if(index!==seasonIndex)return;const through=Math.min(episodeIndex+1,season.count);watchedCount+=through;season.count-=through;season.episodes=season.episodes.slice(through)});s.badge=Math.max(0,s.badge-watchedCount);const nextSeason=s.seasons.find(x=>x.count>0);const next=nextSeason?.episodes[0];if(nextSeason?.poster)s.poster=nextSeason.poster;s.next=next?`${next[0]} · ${next[1]}`:s.badge?'Altre '+s.badge+' puntate':'Sei in pari';s.date=s.badge?'Posizione aggiornata':'Nessuna puntata arretrata'}else{s.episodes.shift();s.badge--;if(s.episodes.length){const e=s.episodes[0];s.next=`${e[0]} · ${e[1]}`;s.date=`Uscita il ${e[2]}`}else{s.next='Sei in pari';s.date='Nessuna puntata arretrata'}}s.lastViewedAt=new Date().toISOString();s.lastViewedBy=activeUser.id;render();toast('Puntata e precedenti segnate come viste')}
    function undoProgress(id){const history=progressHistory.get(id);if(!history?.length)return false;const restored=history.pop(),index=shows.findIndex(show=>show.id===id);shows[index]=restored;if(!history.length)progressHistory.delete(id);render();toast('Ultimo avanzamento annullato');return true}
    list.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const id=Number(b.dataset.id);if(b.classList.contains('watched')){const show=shows.find(x=>x.id===id);const confirmed=await confirmAction({title:'Conferma visualizzazione',message:`Segnare “${show.next}” e tutte le puntate precedenti come viste?`,label:'Segna come vista'});if(confirmed)mark(id)}if(b.classList.contains('details'))showDetail(id)});
    function seasonMarkup(s){
      if(!s.seasons)return `<details class="season" open><summary>Stagione corrente · ${s.badge} da vedere</summary>${s.episodes.length?s.episodes.map(e=>`<div class="episode-row"><div><strong>${e[0]} · ${e[1]}</strong><small>Uscita il ${e[2]}</small></div><button class="mini" data-mark="${s.id}">Vista</button></div>`).join(''):'<div class="empty">Tutte le puntate pubblicate sono state viste.</div>'}</details><details class="season"><summary>Prossime puntate</summary><div class="episode-row"><div><strong>S02 E09 · The After Hours</strong><small>Disponibile dal 14 marzo</small></div></div></details>`;
      const remaining=s.seasons.filter(season=>season.count>0);return remaining.map((season,visibleIndex)=>{const seasonIndex=s.seasons.indexOf(season),upcoming=season.upcoming?`<div class="upcoming-episode"><span class="upcoming-label">Prossima puntata in arrivo</span><strong>${season.upcoming.code} · ${season.upcoming.title}</strong><small>${season.upcoming.date}</small></div>`:'';return `<details class="season" ${visibleIndex===0?'open':''}><summary>Stagione ${season.number} · ${season.count} da vedere</summary>${season.episodes.map((e,episodeIndex)=>`<div class="episode-row"><div><strong>${e[0]} · ${e[1]}</strong><small>${episodeIndex===0&&visibleIndex===0?'Prima puntata da vedere':'Non ancora vista'}</small></div><button class="mini" data-mark="${s.id}" data-season="${seasonIndex}" data-episode="${episodeIndex}">Vista</button></div>`).join('')}<div class="empty">Altre ${Math.max(0,season.count-season.episodes.length)} puntate</div>${upcoming}</details>`}).join('');
    }
    function goHome(){const d=$('#detail');d.style.display='none';$('#home').style.display='block';$('#openAdd').style.display='block';render()}
    function showDetail(id){const s=shows.find(x=>x.id===id);$('#home').style.display='none';$('#openAdd').style.display='none';const d=$('#detail');d.style.display='block';const canUndo=(progressHistory.get(id)?.length??0)>0;d.innerHTML=`<button class="back">← Serie seguite</button><div class="hero"><div class="poster" style="--poster:${s.poster}"><span>${s.title}</span></div><div><h2>${s.title}</h2><p>${s.badge?`${s.badge} puntate pubblicate da vedere.`:'Nessuna puntata arretrata.'}<br>${s.future}</p></div></div>${canUndo?'<button class="undo">↶ Annulla ultima conferma</button>':''}${seasonMarkup(s)}<button class="danger">Rimuovi dalla lista</button>`;d.querySelector('.back').onclick=goHome;d.querySelectorAll('[data-mark]').forEach(b=>b.onclick=async()=>{const showId=Number(b.dataset.mark),row=b.closest('.episode-row'),episode=row.querySelector('strong').textContent;const confirmed=await confirmAction({title:'Conferma visualizzazione',message:`Segnare “${episode}” e tutte le puntate precedenti come viste?`,label:'Segna come vista'});if(!confirmed)return;mark(showId,Number(b.dataset.season),Number(b.dataset.episode));showDetail(showId)});d.querySelector('.undo')?.addEventListener('click',async()=>{const confirmed=await confirmAction({title:'Annullare l’ultima conferma?',message:'La serie tornerà esattamente alla posizione precedente.',label:'Conferma undo'});if(!confirmed)return;undoProgress(id);showDetail(id)});d.querySelector('.danger').onclick=async()=>{const confirmed=await confirmAction({title:'Eliminare la serie?',message:`“${s.title}” verrà rimossa dalla lista condivisa. Questa operazione non può essere annullata.`,label:'Elimina serie',danger:true});if(!confirmed)return;const index=shows.findIndex(show=>show.id===id);shows.splice(index,1);progressHistory.delete(id);goHome();toast('Serie eliminata')}}
    const dlg=$('#addDialog');$('#openAdd').onclick=()=>dlg.showModal();$('#closeAdd').onclick=()=>dlg.close();
    const catalog=[
      {title:'The Bear',meta:'2022 · In corso',poster:'url(https://d32qys9a6wm9no.cloudfront.net/images/tvs/poster/49/570eea88888d3dc85027add640c2efa4_original.jpg?t=1657833014) center/cover',providers:['Disney+']},
      {title:'The White Lotus',meta:'2021 · In corso',poster:'url(https://i.pinimg.com/originals/3a/a3/a8/3aa3a86230cad7f76789ddbef1c12b59.jpg) center/cover',providers:['NOW','Sky Go']},
      {title:'Severance',meta:'2022 · In corso',poster:'url(https://www.sanity.com.au/media/Images/fullimage/1808702/SDC_1402075_2026-29-1--11-40-08.jpg) center/cover',providers:['Apple TV+']},
      {title:'Only Murders in the Building',meta:'2021 · In corso',poster:'url(https://artworks.thetvdb.com/banners/v4/season/2136904/posters/66d89a13c03b6.jpg) center/cover',providers:['Disney+','Prime Video']}
    ];
    function renderSearch(q){$('#results').innerHTML=q?catalog.filter(x=>x.title.toLowerCase().includes(q)).map(x=>{const i=catalog.indexOf(x);return `<button class="result" data-catalog="${i}" style="--poster:${x.poster}"><span class="thumb"></span><span><strong>${x.title}</strong><small>${x.meta} · ${x.providers.length} piattaforme</small></span><span class="plus">＋</span></button>`}).join('')||'<div class="empty">Nessun risultato</div>':''}
    function chooseShow(index){const show=catalog[index];$('#search').hidden=true;$('.hint').hidden=true;$('#results').innerHTML=`<div class="provider-step"><div class="chosen-show" style="--poster:${show.poster}"><span class="thumb"></span><span><strong>${show.title}</strong><small>${show.meta}</small></span></div><h3>Scegli la piattaforma</h3><p>Dove state guardando questa serie?</p><div class="provider-options">${show.providers.map(p=>`<button class="provider-choice" data-provider="${p}">${p}</button>`).join('')}</div><button class="change-show">← Cambia serie</button></div>`;$('.change-show').onclick=resetAdd}
    function resetAdd(){const search=$('#search');search.hidden=false;$('.hint').hidden=false;search.value='';$('#results').innerHTML='';search.focus()}
    $('#search').oninput=e=>renderSearch(e.target.value.toLowerCase().trim());
    $('#results').onclick=e=>{const result=e.target.closest('[data-catalog]');if(result){chooseShow(Number(result.dataset.catalog));return}const provider=e.target.closest('[data-provider]');if(!provider)return;dlg.close();toast('Serie aggiunta su '+provider.dataset.provider);resetAdd()};
    function refreshed(){toast('Serie aggiornate dalla rete')} $('#refresh').onclick=refreshed;$('#refreshTop').onclick=refreshed;$('#sortMode').onchange=render;render();
  </script>
</body>
</html>
